<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>忘年会 セルフ受付</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { 
      background-color: #f5f5f5; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      min-height: 100vh; 
      padding: 20px 10px; 
    }
    .card { 
      border-radius: 16px; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
      width: 100%; 
    }
    .seat-badge { 
      font-size: 2.5rem; 
      font-weight: bold; 
      color: #e53935; 
      background: #ffebee; 
      padding: 12px 24px; 
      border-radius: 16px; 
      display: inline-block; 
    }
    .status-badge { 
      font-size: 0.95rem; 
      font-weight: bold; 
    }
    .name-btn { 
      width: 100%; 
      text-align: left; 
      justify-content: space-between; 
      height: auto; 
      padding: 14px 16px; 
      white-space: normal; 
    }
    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    /* 座席案内画像用のスタイル */
    .seat-map-container {
      border: 2px dashed #dbdbdb;
      border-radius: 12px;
      padding: 8px;
      background-color: #fafafa;
    }
    .seat-map-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <section class="container" style="max-width: 500px;">

    <!-- 1. メイン受付カード -->
    <div id="main-card" class="card p-5">
      <h1 class="title has-text-centered is-4 mb-2">🎉 忘年会 セルフ受付</h1>
      
      <!-- 読み込み中表示 -->
      <div id="loading-msg" class="notification is-info is-light has-text-centered">
        参加者データを照会しています...
      </div>

      <!-- A. 個人リンク用：カメラ読み取りエリア -->
      <div id="camera-area" style="display: none;">
        <p id="user-welcome" class="has-text-centered has-text-weight-bold is-size-4 mb-1"></p>
        <div class="notification is-warning is-light has-text-centered py-2 px-3 my-3">
          <p class="is-size-7 has-text-weight-bold">📷 会場入口の受付QRコードをカメラにかざしてください</p>
        </div>
        <div id="reader"></div>
      </div>

      <!-- B. 直接アクセス用：部署・名前リスト選択エリア -->
      <div id="manual-area" style="display: none;">
        <p class="has-text-centered has-text-grey is-size-7 mb-4">部署を選択後、お名前をタップしてください</p>
        
        <div class="field mb-4">
          <label class="label is-small">① 部署を選択してください</label>
          <div class="control">
            <div class="select is-fullwidth is-medium">
              <select id="dept-select" onchange="filterNamesByDepartment()">
              </select>
            </div>
          </div>
        </div>

        <div id="name-area" class="field mt-5" style="display: none;">
          <label class="label is-small">② お名前をタップしてください</label>
          <div id="name-list" class="buttons">
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 受付完了＆お席案内カード -->
    <div id="result-card" class="card has-text-centered p-5" style="display: none;">
      <p class="is-size-6 has-text-success-dark has-text-weight-bold mb-1">✅ 受付が完了しました！</p>
      <p id="res-dept" class="is-size-6 mb-1 has-text-grey"></p>
      <p id="res-name" class="is-size-3 has-text-weight-bold mb-3"></p>
      
      <div class="my-2">
        <p class="is-size-7 has-text-weight-bold has-text-grey mb-1">本日のお席</p>
        <span id="res-seat" class="seat-badge"></span>
      </div>

      <p id="sync-status" class="status-badge has-text-grey my-3"></p>

      <!-- 💡 座席案内MAP画像表示エリア -->
      <div class="seat-map-container mt-4">
        <p class="is-size-7 has-text-weight-bold has-text-grey mb-2">🗺️️ 会場座席マップ</p>
        
        <!-- srcのURLをGoogleドライブのダイレクトURLに差し替え -->
        <img src="https://drive.google.com/file/d/178Pv7YpkU_zGfG_BrwGtVySIp_OUcX2_/view?usp=sharing" alt="会場座席マップ" class="seat-map-img" onerror="this.style.display='none'; document.getElementById('map-error').style.display='block';">
        
        <p id="map-error" class="is-size-7 has-text-grey-light" style="display:none;">※マップ画像の読み込みに失敗しました</p>
      </div>
      
      <div id="back-btn-area" class="mt-4" style="display: none;">
        <button onclick="resetSelection()" class="button is-light is-small">← 選択画面に戻る</button>
      </div>
    </div>

  </section>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxlDFQLyMiWDSezU3Kx3kO9jX6FrnV5jpbIh3pgfNeN5a0wcb1_JvxgVO6QnsSb-X9kBA/exec';

    let cachedParticipants = [];
    let currentUser = null;
    let html5QrCode = null;

    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    async function loadData() {
      try {
        const response = await fetch(`${GAS_API_URL}?action=getData`);
        if (!response.ok) throw new Error("HTTP error " + response.status);
        
        const data = await response.json();
        
        if (Array.isArray(data)) {
          cachedParticipants = data;
          document.getElementById('loading-msg').style.display = 'none';

          const targetUserId = getQueryParam('uid');
          
          if (targetUserId) {
            currentUser = cachedParticipants.find(p => p.id === targetUserId.trim());
            if (!currentUser) {
              showError("該当する参加者データが見つかりません (ID: " + targetUserId + ")");
              return;
            }
            setupCameraCheckIn();
          } else {
            document.getElementById('back-btn-area').style.display = 'block';
            setupManualCheckIn();
          }
        } else {
          showError("データ形式が不正です。スプレッドシートをご確認ください。");
        }
      } catch (err) {
        showError("❌ データの通信に失敗しました。<br>GASのアクセス権限をご確認ください。");
      }
    }

    function setupCameraCheckIn() {
      document.getElementById('camera-area').style.display = 'block';
      document.getElementById('user-welcome').innerText = `${currentUser.name} 様`;

      if (currentUser.isAttended && currentUser.seat) {
        showResultCard("⚠️ 既に受付済みです");
        return;
      }

      startCameraScanner();
    }

    function startCameraScanner() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        showError("📷 カメラの起動に失敗しました。<br>ブラウザの「カメラアクセス権限」を許可してください。");
      });
    }

    function onScanSuccess(decodedText) {
      if (decodedText.includes('shintbt.github.io/selfAttendance')) {
        if (html5QrCode) {
          html5QrCode.stop().then(() => executeAttendanceRecord(currentUser)).catch(() => executeAttendanceRecord(currentUser));
        } else {
          executeAttendanceRecord(currentUser);
        }
      }
    }

    function setupManualCheckIn() {
      document.getElementById('manual-area').style.display = 'block';
      const deptSelect = document.getElementById('dept-select');

      const departments = Array.from(
        new Set(cachedParticipants.map(p => (p.department || 'その他').trim()))
      );

      deptSelect.innerHTML = '<option value="" disabled selected>-- 部署を選択してください --</option>';
      departments.forEach(dept => {
        const opt = document.createElement('option');
        opt.value = dept;
        opt.innerText = dept;
        deptSelect.appendChild(opt);
      });
    }

    function filterNamesByDepartment() {
      const selectedDept = document.getElementById('dept-select').value;
      const nameArea = document.getElementById('name-area');
      const nameList = document.getElementById('name-list');
      
      if (!selectedDept) return;

      nameArea.style.display = 'block';
      nameList.innerHTML = '';

      const filtered = cachedParticipants.filter(p => {
        const pDept = (p.department || 'その他').trim();
        return pDept === selectedDept;
      });

      if (filtered.length === 0) {
        nameList.innerHTML = '<p class="has-text-grey is-size-7 p-2">該当する参加者がいません</p>';
        return;
      }

      filtered.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'button is-white is-outlined name-btn mb-2';
        btn.style.border = '1px solid #dbdbdb';
        
        if (p.isAttended && p.seat) {
          btn.innerHTML = `<span><strong>${p.name}</strong></span><span class="tag is-warning is-light">受付済</span>`;
        } else {
          btn.innerHTML = `<span><strong>${p.name}</strong></span><span class="tag is-info is-light">未受付</span>`;
        }

        btn.onclick = () => selectParticipant(p.id);
        nameList.appendChild(btn);
      });
    }

    function selectParticipant(id) {
      const participant = cachedParticipants.find(p => p.id === id);
      if (!participant) return;

      const confirmText = `【受付確認】\n\nお名前：${participant.name} 様\n部 署：${participant.department || ''}\n\n上記のお名前で受付を行ってもよろしいですか？`;
      
      if (!confirm(confirmText)) {
        return;
      }

      executeAttendanceRecord(participant);
    }

    async function executeAttendanceRecord(participant) {
      currentUser = participant;
      document.getElementById('main-card').style.display = 'none';
      showResultCard("⏳ お席を割り当て中...");

      currentUser.isAttended = true;

      try {
        const response = await fetch(`${GAS_API_URL}?action=record&id=${encodeURIComponent(currentUser.id)}`);
        const res = await response.json();
        
        const syncStatus = document.getElementById('sync-status');
        const resSeat = document.getElementById('res-seat');

        if (res && res.status === 'success') {
          if (res.seat) resSeat.innerText = res.seat;

          if (res.isAlreadyAttended) {
            syncStatus.className = "status-badge has-text-warning-dark";
            syncStatus.innerText = "⚠️ 既に受付済みです";
          } else {
            syncStatus.className = "status-badge has-text-success";
            syncStatus.innerText = "✅ お席が確定しました";
          }
        } else {
          syncStatus.className = "status-badge has-text-danger";
          syncStatus.innerText = "❌ 記録エラーが発生しました";
        }
      } catch (err) {
        const syncStatus = document.getElementById('sync-status');
        syncStatus.className = "status-badge has-text-danger";
        syncStatus.innerText = "❌ 送信エラーが発生しました";
      }
    }

    function showResultCard(initialStatusText) {
      document.getElementById('main-card').style.display = 'none';
      document.getElementById('result-card').style.display = 'block';

      document.getElementById('res-dept').innerText = currentUser.department || '';
      document.getElementById('res-name').innerText = (currentUser.name || '') + " 様";
      document.getElementById('res-seat').innerText = currentUser.seat || '割り当て中...';

      const syncStatus = document.getElementById('sync-status');
      syncStatus.className = "status-badge has-text-info";
      syncStatus.innerText = initialStatusText;
    }

    function resetSelection() {
      document.getElementById('result-card').style.display = 'none';
      document.getElementById('main-card').style.display = 'block';
      
      document.getElementById('dept-select').selectedIndex = 0;
      document.getElementById('name-area').style.display = 'none';
    }

    function showError(msg) {
      const loadingMsg = document.getElementById('loading-msg');
      loadingMsg.className = "notification is-danger is-light";
      loadingMsg.innerHTML = msg;
    }

    window.onload = loadData;
  </script>
</body>
</html>
