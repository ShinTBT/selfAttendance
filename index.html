<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>忘年会 セルフ受付</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <!-- カメラでQRコードを読み取るためのライブラリ -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { 
      background-color: #f5f5f5; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      min-height: 100vh; 
      padding: 20px 10px; 
    }
    .card { 
      border-radius: 16px; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
      width: 100%; 
    }
    .seat-badge { 
      font-size: 3rem; 
      font-weight: bold; 
      color: #e53935; 
      background: #ffebee; 
      padding: 15px 30px; 
      border-radius: 16px; 
      display: inline-block; 
    }
    .status-badge { 
      font-size: 1rem; 
      font-weight: bold; 
    }
    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
  <section class="container" style="max-width: 500px;">

    <!-- 1. カメラ読み取り / 個人確認カード -->
    <div id="scan-card" class="card p-5">
      <h1 class="title has-text-centered is-4 mb-2">🎉 忘年会 セルフ受付</h1>
      <p id="user-welcome" class="has-text-centered has-text-weight-bold is-size-5 mb-1"></p>
      <p id="scan-instruction" class="has-text-centered has-text-grey is-size-7 mb-4">会場の受付QRコードをカメラにかざしてください</p>
      
      <!-- 読み込み中表示 -->
      <div id="loading-msg" class="notification is-info is-light has-text-centered">
        参加者データを照会しています...
      </div>

      <!-- カメラ表示領域 -->
      <div id="reader" style="display: none;"></div>
    </div>

    <!-- 2. 受付完了＆お席案内カード -->
    <div id="result-card" class="card has-text-centered p-5" style="display: none;">
      <p class="is-size-6 has-text-success-dark has-text-weight-bold mb-2">✅ 受付が完了しました！</p>
      <p id="res-dept" class="is-size-5 mb-1 has-text-grey"></p>
      <p id="res-name" class="is-size-2 has-text-weight-bold mb-4"></p>
      
      <hr style="margin: 1.5rem 0;">

      <p class="is-size-6 has-text-weight-bold mb-2">本日のお席はこちらです</p>
      <div class="my-3">
        <span id="res-seat" class="seat-badge"></span>
      </div>

      <p id="sync-status" class="status-badge has-text-grey mt-4"></p>
    </div>

  </section>

  <script>
    // 連携する Google Apps Script (GAS) のWebアプリURL
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbx2_ivlGUTS31U-yoOIi3_y4kjVrUBjUBbEi0R1neI5pYrZ98it7pl7Q-rZnX06ucvtZQ/exec';

    let cachedParticipants = [];
    let currentUser = null;
    let html5QrCode = null;

    // URLパラメータからIDを取得 (?id=usr001)
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // データ受信コールバック
    window.handleDataLoaded = function(data) {
      if (data && Array.isArray(data)) {
        cachedParticipants = data;
        const targetId = getQueryParam('id');
        
        if (!targetId) {
          showError("個人用アクセスURLが無効です。配布されたメールのリンクから開き直してください。");
          return;
        }

        currentUser = cachedParticipants.find(p => p.id === targetId.trim());
        if (!currentUser) {
          showError("該当する参加者データが見つかりません (ID: " + targetId + ")");
          return;
        }

        // 本人確認が取れたら画面表示・カメラ起動
        setupUserCheckIn();
      } else if (data && data.status === 'error') {
        showError("GASエラー: " + data.message);
      } else {
        showError("データ形式が不正です。スプレッドシートをご確認ください。");
      }
    };

    // 本人画面のセットアップとカメラの起動
    function setupUserCheckIn() {
      document.getElementById('loading-msg').style.display = 'none';
      document.getElementById('user-welcome').innerText = `${currentUser.name} 様`;

      // 既に受付済みの場合はそのまま結果画面を表示
      if (currentUser.isAttended && currentUser.seat) {
        showResultCard("⚠️ 既に受付済みです");
        return;
      }

      // 未受付の場合はカメラを起動
      document.getElementById('reader').style.display = 'block';
      startCameraScanner();
    }

    // QRカメラの読み取り開始
    function startCameraScanner() {
      html5QrCode = new Html5Qrcode("reader");
      
      const config = { 
        fps: 10, 
        qrbox: { width: 250, height: 250 } 
      };

      // 外カメラ（environment）を優先起動
      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        showError("カメラの起動に失敗しました。カメラの利用権限を許可してください。");
      });
    }

    // QRコード読み取り成功時のコールバック
    function onScanSuccess(decodedText, decodedResult) {
      // 会場の共通QRコードURL（またはその文字列）が含まれているか判定
      if (decodedText.includes('shintbt.github.io/selfAttendance')) {
        // カメラを停止
        if (html5QrCode) {
          html5QrCode.stop().then(() => {
            // 受付処理を実行
            executeAttendanceRecord();
          });
        } else {
          executeAttendanceRecord();
        }
      }
    }

    // 受付確定およびGAS通信処理
    function executeAttendanceRecord() {
      document.getElementById('scan-card').style.display = 'none';
      showResultCard("⏳ お席をランダム割り当て中...");

      currentUser.isAttended = true;

      const recordScript = document.createElement('script');
      recordScript.src = `${GAS_API_URL}?action=record&id=${encodeURIComponent(currentUser.id)}&callback=handleRecordComplete&_=${new Date().getTime()}`;
      recordScript.onerror = function() {
        const syncStatus = document.getElementById('sync-status');
        syncStatus.className = "status-badge has-text-danger";
        syncStatus.innerText = "❌ 通信エラーが発生しました";
      };
      document.body.appendChild(recordScript);
    }

    // 受付完了結果の表示
    function showResultCard(initialStatusText) {
      document.getElementById('scan-card').style.display = 'none';
      document.getElementById('result-card').style.display = 'block';

      document.getElementById('res-dept').innerText = currentUser.department || '';
      document.getElementById('res-name').innerText = (currentUser.name || '') + " 様";
      document.getElementById('res-seat').innerText = currentUser.seat || '割り当て中...';

      const syncStatus = document.getElementById('sync-status');
      syncStatus.className = "status-badge has-text-info";
      syncStatus.innerText = initialStatusText;
    }

    // GASからのレスポンス処理
    window.handleRecordComplete = function(res) {
      const syncStatus = document.getElementById('sync-status');
      const resSeat = document.getElementById('res-seat');
      
      if (res && res.status === 'success') {
        if (res.seat) {
          resSeat.innerText = res.seat;
        }

        if (res.isAlreadyAttended) {
          syncStatus.className = "status-badge has-text-warning-dark";
          syncStatus.innerText = "⚠️ 既に受付済みです";
        } else {
          syncStatus.className = "status-badge has-text-success";
          syncStatus.innerText = "✅ お席が確定しました（案内メール送信済）";
        }
      } else {
        syncStatus.className = "status-badge has-text-danger";
        syncStatus.innerText = "❌ 記録エラー: " + (res ? res.message : '通信失敗');
      }
    };

    function showError(msg) {
      const loadingMsg = document.getElementById('loading-msg');
      loadingMsg.className = "notification is-danger is-light";
      loadingMsg.innerHTML = msg;
    }

    // 起動時のデータ読み込み
    window.onload = function() {
      const script = document.createElement('script');
      script.src = `${GAS_API_URL}?action=getData&callback=handleDataLoaded&_=${new Date().getTime()}`;
      script.onerror = function() {
        showError("通信エラーが発生しました。接続状況をご確認ください。");
      };
      document.body.appendChild(script);
    };
  </script>
</body>
</html>
